<!DOCTYPE html>
<html>
<head>
    <title>Inside My Halloween Card</title>
    <link rel="icon" type="image/png" href="logo.jpg">

    <style>
        body {
            background-color: #171022;
            color: orange;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            font-size: 35px;
            color: orange;
            border: 4px solid purple;
            padding: 15px;
            margin: 20px;
            border-radius: 10px;
        }

        p {
            font-size: 20px;
            color: white;
        }

        img {
            width: 200px;
            border: 5px solid orange;
            border-radius: 10px;
            padding: 5px;
            margin: 10px;
        }

        .box {
            border: 3px solid purple;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
        }

        ol {
            display: inline-block;
            text-align: left;
            border: 3px solid orange;
            padding: 20px 40px;
            border-radius: 10px;
            background-color: #241632;
        }

        li {
            padding: 5px;
            color: white;
        }

        h2 {
            color: lightblue;
        }

        audio {
            margin: 10px;
        }

        video {
            width: 400px;
            border: 5px solid orange;
            border-radius: 10px;
            margin: 10px;
        }

        button {
            background-color: orange;
            color: black;
            padding: 10px 18px;
            border: 2px solid purple;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover {
            background-color: purple;
            color: white;
        }

        .button {
            background-color: black;
            color: orange;
            padding: 10px 18px;
            text-decoration: none;
            border: 2px solid orange;
            border-radius: 5px;
        }

        .button:hover {
            background-color: orange;
            color: black;
        }
    </style>
</head>

<body>

    <h1>Have a Happy Halloween!</h1>

    <div class="box">

        <p>
            I hope you have a Happy Halloween!
        </p>

        <img src="pumpkin.jpg" alt="Halloween pumpkin">

    </div>

    <h2>5 Things I Like About Halloween</h2>

    <ol>
        <li>Candy</li>
        <li>Hanging out with friends</li>
        <li>No school</li>
        <li>Movies</li>
        <li>Staying up late</li>
    </ol>

    <h2>Music</h2>

    <audio controls>
        <source src="hallwnmusic.mp3" type="audio/mpeg">
    </audio>

    <h2>Halloween Videos</h2>

   <video controls>
    <source src="skelyvid.mp4" type="video/mp4">
</video>

<video controls>
    <source src="pumpvid.mp4" type="video/mp4">
</video>

    <br><br>

    <button onclick="confetti()">
        Click Me
    </button>

    <br><br>

    <a class="button" href="index.html">Back to Front</a>

    <script>
        function confetti() {
            for (let i = 0; i < 100; i++) {
                let piece = document.createElement("div");

                piece.style.position = "fixed";
                piece.style.width = "10px";
                piece.style.height = "10px";

                piece.style.backgroundColor =
                    ["orange", "purple", "yellow", "red", "blue"]
                    [Math.floor(Math.random() * 5)];

                piece.style.left = Math.random() * 100 + "vw";
                piece.style.top = "-10px";
                piece.style.zIndex = "9999";

                document.body.appendChild(piece);

                let fall = piece.animate([
                    {
                        transform: "translateY(0) rotate(0deg)"
                    },
                    {
                        transform: "translateY(100vh) rotate(720deg)"
                    }
                ], {
                    duration: 2000 + Math.random() * 2000,
                    easing: "linear"
                });

                fall.onfinish = () => piece.remove();
            }
        }
    </script>

</body>
</html>
