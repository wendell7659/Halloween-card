<!DOCTYPE html>
<html>
<head>
    <title>Happy Halloween!</title>
<link rel="icon" type="image/png" href="logo.jpg">
    <style>
        body {
            background-color: #160b24;
            color: orange;
            text-align: center;
            font-family: Arial;
        }

        .card {
            background-color: #28133d;
            width: 80%;
            margin: 40px auto;
            padding: 30px;
            border: 3px solid orange;
            border-radius: 15px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
        }

        img {
            width: 450px;
            border-radius: 12px;
            border: 3px solid orange;
        }

        .button {
            display: inline-block;
            background-color: orange;
            color: black;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }

        .button:hover {
            background-color: white;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>🎃Happy Halloween!🎃</h1>

        <p>It's Halloween!!!</p>
        <p>WooHoo</p>

        <img src="skely.jpg" alt="Halloween skeleton">

        <a class="button" href="Page2.html">Open the Card</a>
